syntax = "proto3";
package byokey.status;

service StatusService {
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  rpc GetUsage(GetUsageRequest) returns (GetUsageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message GetStatusRequest {}

message GetStatusResponse {
  ServerInfo server = 1;
  repeated ProviderStatus providers = 2;
}

message ServerInfo {
  string host = 1;
  uint32 port = 2;
  // The server's release, e.g. `3.1.0`.
  string version = 3;
  // Bumped on every change to this API a client must know about; clients
  // declare the range they speak and ask for an update outside it.
  uint32 api_version = 4;
  // Absolute path of the running server binary, so a client can tell how it
  // was installed (e.g. a Homebrew Cellar path).
  string executable = 5;
}

message ProviderStatus {
  string id = 1;
  string display_name = 2;
  bool enabled = 3;
  AuthStatus auth_status = 4;
}

enum AuthStatus {
  AUTH_STATUS_UNSPECIFIED = 0;
  AUTH_STATUS_VALID = 1;
  AUTH_STATUS_EXPIRED = 2;
  AUTH_STATUS_NOT_CONFIGURED = 3;
}

message GetUsageRequest {}

message GetUsageResponse {
  uint64 total_requests = 1;
  uint64 success_requests = 2;
  uint64 failure_requests = 3;
  uint64 input_tokens = 4;
  uint64 output_tokens = 5;
  map<string, ModelStats> models = 6;
}

message ModelStats {
  uint64 requests = 1;
  uint64 success = 2;
  uint64 failure = 3;
  uint64 input_tokens = 4;
  uint64 output_tokens = 5;
}
