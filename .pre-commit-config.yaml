repos:
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: rust-fmt
        name: Rust format check
        entry: cargo fmt -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: rust-clippy
        name: Rust clippy check
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: surge-check
        name: Surge script format and lint
        entry: biome check biome.json integrations/surge
        language: system
        files: ^(biome\.json|integrations/surge/.*\.(js|mjs))$
        pass_filenames: false

      - id: surge-test
        name: Surge module tests
        entry: node --test integrations/surge/codex-hide-usage-banner.test.mjs
        language: system
        files: ^integrations/surge/.*\.(js|mjs|sgmodule)$
        pass_filenames: false
