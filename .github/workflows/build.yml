name: Build

on:
  release:
    types: [created]
  # Rebuild an existing release, e.g. to fill in a target that failed. A rerun
  # replays the workflow as of the tagged commit; this runs the current one.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build (e.g. v1.4.1)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ github.event.release.tag_name || inputs.tag }}
  SENTRY_CLI_VERSION: "3.8.0"

jobs:
  build:
    name: ${{ matrix.target }}
    # Only build for the root byokey tag (v*). Skip per-crate tags like
    # byokey-proto-v* or byokey-daemon-v* that release-plz may emit.
    if: startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ${{ matrix.os }}
    env:
      # Lift secrets to job-level env so conditional steps can gate on them.
      # When a fork builds without secrets configured, these become empty
      # and the Sentry upload steps skip gracefully.
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT_DAEMON }}
      BYOKEY_SENTRY_DSN: ${{ secrets.BYOKEY_DAEMON_SENTRY_DSN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ env.TAG }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        shell: bash
        run: cargo build --release --target ${{ matrix.target }}

      - name: Install sentry-cli (Unix)
        # A pinned binary from GitHub releases. sentry.io/get-cli installs
        # "latest" through Sentry's release registry, which kept failing on
        # the x86_64 Linux runner and took that target out of v1.4.1.
        if: env.SENTRY_AUTH_TOKEN != '' && runner.os != 'Windows'
        shell: bash
        run: |
          case "$(uname -s)" in
            Darwin) suffix=Darwin-universal ;;
            Linux) suffix="Linux-$(uname -m)" ;;
          esac
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSL --retry 5 --retry-all-errors \
            -o "$RUNNER_TEMP/bin/sentry-cli" \
            "https://github.com/getsentry/sentry-cli/releases/download/${SENTRY_CLI_VERSION}/sentry-cli-${suffix}"
          chmod +x "$RUNNER_TEMP/bin/sentry-cli"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Upload Rust debug symbols to Sentry
        # Skipped on Windows: sentry-cli's Windows support is spotty and
        # the install path above is Unix-only. Runtime Sentry still works
        # on Windows; only stack-trace symbolication is missing there.
        if: env.SENTRY_AUTH_TOKEN != '' && runner.os != 'Windows'
        shell: bash
        run: |
          sentry-cli debug-files upload \
            --include-sources \
            "target/${{ matrix.target }}/release/"

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          BIN="target/${{ matrix.target }}/release/byokey"
          ARCHIVE="byokey-${TAG}-${{ matrix.target }}.tar.gz"
          tar czf "$ARCHIVE" -C "$(dirname "$BIN")" "$(basename "$BIN")"
          echo "ASSET=$ARCHIVE" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "byokey-$env:TAG-${{ matrix.target }}.zip"
          Compress-Archive -Path "target\${{ matrix.target }}\release\byokey.exe" -DestinationPath $archive
          "ASSET=$archive" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          files: ${{ env.ASSET }}
          # A rebuild only fills in what is missing. Replacing a published
          # archive would change its checksum under anyone who fetched it.
          overwrite_files: false

  update-homebrew:
    name: Update Homebrew
    needs: build
    if: always() && !cancelled() && startsWith(github.event.release.tag_name || inputs.tag, 'v')
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}
          repositories: homebrew-tap
      - name: Trigger homebrew-tap update
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ steps.app-token.outputs.token }}
          repository: AprilNEA/homebrew-tap
          event-type: update-formula
          client-payload: '{"version": "${{ env.TAG }}"}'
